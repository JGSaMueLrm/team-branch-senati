<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Online - SENATI</title>
    <link rel="shortcut icon" href="../img/logo-senati.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

    <!-- HEADER -->
    <header class="page-header">
        <div class="header-content">
            <div class="header-left">
                <img src="../img/logo-senati.png" alt="SENATI" class="logo">
                <div class="header-title">
                    <h1>Biblioteca Online</h1>
                    <p>Recursos bibliográficos digitales</p>
                </div>
            </div>
            <a href="../index.html" class="btn-back">← Volver al Inicio</a>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">

        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <a href="../index.html">Inicio</a> / <span>Biblioteca Online</span>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <h2>🔍 Buscar Recursos</h2>
            <div class="search-bar">
                <input type="text" placeholder="Buscar libros, revistas, artículos...">
                <button class="btn-search">Buscar</button>
            </div>
            <div class="search-filters">
                <select>
                    <option>Todas las categorías</option>
                    <option>Libros</option>
                    <option>Revistas</option>
                    <option>Artículos</option>
                    <option>Tesis</option>
                </select>
                <select>
                    <option>Todas las carreras</option>
                    <option>Mecánica Industrial</option>
                    <option>Electrotecnia</option>
                    <option>Computación e Informática</option>
                    <option>Construcción Civil</option>
                </select>
            </div>
        </div>
